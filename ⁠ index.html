<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHA CLOTHING | متحرك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; padding-bottom: 30px; overflow-x: hidden; }
        
        header { 
            background-color: #111111; 
            text-align: center; 
            padding: 25px; 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            border-bottom: 1px solid #222;
            animation: fadeInDown 0.8s ease-out;
        }
        .subtitle { font-size: 12px; color: #888; margin-top: 5px; font-weight: normal; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        
        .product-card { 
            background: #161616; 
            border: 1px solid #222; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transform: translateY(40px);
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
        }
        
        .product-img { width: 100%; height: 350px; background-color: #1f1f1f; display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; border-bottom: 1px solid #222; font-weight: bold; }
        .product-info { padding: 20px; text-align: right; }
        .product-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .product-price { color: #00ff66; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        .product-desc { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }
        
        .btn-buy { 
            display: block; 
            width: 100%; 
            background-color: #ffffff; 
            color: #000000; 
            text-align: center; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            animation: pulse 2s infinite;
        }
        
        footer { text-align: center; padding: 20px; font-size: 12px; color: #444; border-top: 1px solid #111; margin-top: 20px; }

        @keyframes fadeInUp { to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body>

    <header>
        MHA STORE
        <div class="subtitle">ملابس عصرية وشبابية | STREETWEAR</div>
    </header>

    <div class="container">
        <div class="product-card">
            <div class="product-img">👕 [صورة بنطلون باجي / تيشرت عريض]</div>
            <div class="product-info">
                <div class="product-title">بنطلون باجي جينز - Baggy Pants</div>
                <div class="product-price">30,000 د.ع</div>
                <div class="product-desc">بنطال جينز فضفاض وعصري بقصة واسعة مريحة (Oversized)، متوفر بجميع المقاسات والألوان الدارجة لعام 2026. خامات قطنية ممتازة.</div>
                <button class="btn-buy" onclick="alert('سيتم ربط هذا الزر بالواتساب قريباً!')">اطلب الآن عبر الواتساب</button>
            </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة © MHA CLOTHING 2026</footer>

</body>
</html>
